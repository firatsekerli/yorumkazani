name = "yorumkazani"
compatibility_date = "2026-11-01"
pages_build_output_dir = "public"

[vars]
FREE_PER_DAY = "3"
CLAUDE_MODEL = "claude-haiku-5-5"

# Create with:  npx wrangler d1 create yorumkazani
# then paste the database_id it prints here.
[[d1_databases]]
binding = "DB"
database_name = "yorumkazani"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
