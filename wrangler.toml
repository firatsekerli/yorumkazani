name = "yorumkazani"
compatibility_date = "2026-11-01"
pages_build_output_dir = "public"

[vars]
POSTS_PER_DAY = "5"
# "ai" = Claude checks each photo before it goes live (needs ANTHROPIC_API_KEY)
# "manual" = every photo waits for approval on /admin
# "off" = photos go live immediately (not recommended)
# If unset: "ai" when ANTHROPIC_API_KEY exists, otherwise "manual".
MODERATION = "ai"
CLAUDE_MODEL = "claude-sonnet-5-5"

# npx wrangler d1 create yorumkazani   -> paste the database_id it prints
[[d1_databases]]
binding = "DB"
database_name = "yorumkazani"
database_id = "8d7ddb72-c8a4-49b5-8659-13b40ae26c73"

# Photos are stored in Workers KV (free tier, no subscription needed).
# npx wrangler kv namespace create yorumkazani-images   -> paste the id it prints
[[kv_namespaces]]
binding = "IMAGES"
id = "f8421ca988674067bd665bc796b12f5a"
