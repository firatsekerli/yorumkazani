<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yorum Kazanı · Fotoğrafını at, millet yorumlasın</title>
  <meta name="description" content="Fotoğrafını kazana at, millet yorumlasın. En iyi yorum kazanır.">
  <meta property="og:title" content="Yorum Kazanı">
  <meta property="og:description" content="Fotoğrafını kazana at, millet yorumlasın. En iyi yorum kazanır.">
  <meta property="og:image" content="/brand/logo.png">
  <meta name="theme-color" content="#f13e3a">
  <!-- Turnstile site key (public). This is Cloudflare's test key; replace it with your own before going live. -->
  <meta name="turnstile-sitekey" content="1x00000000000000000000AA">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/brand/icon-256.png">
  <link rel="preload" href="/fonts/bangers-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/style.css">
  <style>
    .simple { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 32px 16px; }
    .simple-in { max-width: 460px; }
    .simple img.logo { width: 220px; height: auto; margin: 0 auto 18px; }
    .simple h1 { font-family: var(--display); font-weight: 400; letter-spacing: .02em; font-size: 44px; line-height: 1.05; margin: 0 0 12px; color: var(--ink-strong); }
    .simple p { font-size: 18px; font-weight: 700; color: var(--muted); margin: 0 0 26px; line-height: 1.5; }
    .simple .btn { font-size: 20px; padding: 15px 34px; }
    .simple small { display: block; margin-top: 28px; color: var(--muted); font-weight: 600; }
  </style>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body>
  <main class="simple">
    <div class="simple-in">
      <img class="logo" src="/brand/logo-480.png" alt="Yorum Kazanı" width="220" height="150">
      <h1>Fotoğrafını at, millet yorumlasın.</h1>
      <p>Kombin, ev, yemek, mesaj ya da garip bir tabela.<br>Kazana at, en komik yorum kazansın.</p>
      <button class="btn btn-red" data-open-upload>Kazana at</button>
      <small>Bir <a href="https://asparajans.com" rel="noopener">asparajans</a> projesi.</small>
    </div>
  </main>

  <!-- upload sheet -->
  <div class="sheet-bg" id="sheet" hidden>
    <form class="sheet" id="uploadForm" novalidate>
      <button type="button" class="sheet-close" id="sheetClose" aria-label="Kapat">×</button>
      <h2>Kazana at</h2>

      <label class="drop" id="drop">
        <input type="file" id="file" accept="image/*" hidden>
        <img id="preview" alt="Seçilen fotoğraf" hidden>
        <span id="dropEmpty"><strong>Fotoğraf seç</strong><small>Telefonundan ya da bilgisayarından</small></span>
      </label>

      <div class="field">
        <label for="question">Millete ne soruyorsun? <span class="hint">(isteğe bağlı)</span></label>
        <input id="question" maxlength="120" placeholder="Örn: Bu kombinle düğüne gidilir mi?">
      </div>

      <div class="field">
        <label for="nick">Takma adın</label>
        <input id="nick" maxlength="24" placeholder="Anonim" autocomplete="nickname">
      </div>

      <p class="hint" style="margin-top:12px">Çocuk, çıplaklık, kimlik, plaka, telefon numarası yok. Konum bilgisi otomatik silinir.</p>

      <div class="ts" id="uploadTs"></div>
      <p class="error" id="uploadError" hidden></p>
      <button class="btn btn-red btn-big" id="uploadBtn" type="submit" disabled style="margin-top:14px">Kazana at!</button>
    </form>
  </div>

  <script type="module" src="/home.js"></script>
</body>
</html>
